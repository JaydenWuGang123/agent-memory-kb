name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Configure git identity for tests
        run: |
          git config --global user.name "CI Tester"
          git config --global user.email "ci@example.com"

      - name: Run unit tests
        env:
          PERSONAL_KB_SKIP_KEYCHAIN: "1"
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: End-to-end init and doctor verification
        env:
          PERSONAL_KB_SKIP_KEYCHAIN: "1"
        run: |
          python3 init_kb.py --root /tmp/test-agent-memory-kb
          python3 /tmp/test-agent-memory-kb/_同步/kb_doctor.py --json
