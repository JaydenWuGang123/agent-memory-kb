name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Configure git identity for tests
        run: |
          git config --global user.name "CI Tester"
          git config --global user.email "ci@example.com"

      - name: Run unit tests
        env:
          PERSONAL_KB_SKIP_KEYCHAIN: "1"
          PYTHONUTF8: "1"
        run: |
          python -m unittest discover -s scripts -p "test_*.py" -v

      - name: End-to-end init and doctor verification (dev & general profiles)
        env:
          PERSONAL_KB_SKIP_KEYCHAIN: "1"
          PYTHONUTF8: "1"
        shell: bash
        run: |
          python init_kb.py --root ./tmp-ci-dev-kb --profile dev
          python ./tmp-ci-dev-kb/_同步/kb_doctor.py --root ./tmp-ci-dev-kb --skip-external-checks
          python init_kb.py --root ./tmp-ci-general-kb --profile general
          python ./tmp-ci-general-kb/_同步/kb_doctor.py --root ./tmp-ci-general-kb --skip-external-checks
